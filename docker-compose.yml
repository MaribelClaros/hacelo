# Runs hacelo plus Caddy, which terminates HTTPS with an automatic
# Let's Encrypt certificate. Used for self-hosting (see docs/gcp.md).
#
#   cp .env.example .env   # fill it in
#   docker compose up -d --build

services:
  hacelo:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/hacelo.db
      API_TOKEN: ${API_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBSCRIBER: ${VAPID_SUBSCRIBER}
    volumes:
      - hacelo_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - hacelo

volumes:
  hacelo_data:
  caddy_data:
