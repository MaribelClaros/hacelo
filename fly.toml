# Fly.io config. Usually generated by `fly launch`, written by hand here.
#
# Before the first deploy:
#   fly volumes create hacelo_data --size 1 --region <your region>
#   fly secrets set API_TOKEN=... VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBSCRIBER=mailto:you@yourdomain.com
#   fly deploy

app = "hacelo"
primary_region = "eze" # Buenos Aires. Change it if the region is unavailable.

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/hacelo.db"

[[mounts]]
  source = "hacelo_data"
  destination = "/data"

# The machine must stay up: the scheduler runs inside it.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
